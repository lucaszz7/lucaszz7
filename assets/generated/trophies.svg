<svg xmlns="http://www.w3.org/2000/svg" width="440" height="328" viewBox="0 0 440 328" role="img" aria-labelledby="title"><title id="title">Milestones derived from real public repository data</title><style>text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,Menlo,monospace}.label{fill:#9fb4a6;font-size:12px}.value{fill:#eef6f0;font-size:32px;font-weight:600}.small{fill:#9fb4a6;font-size:11px}</style><rect x=".5" y=".5" width="439" height="327" rx="14" fill="#101715" stroke="#2c3b34"/><text x="24" y="31" class="mono" fill="#7ee2b8" font-size="12" letter-spacing="1.5">TROPHIES / VERIFIED MILESTONES</text><text x="24" y="53" class="small" >Conditions checked against public GitHub data</text><circle cx="33" cy="85" r="8" fill="#7ee2b8"/><text x="54" y="88" class="mono" fill="#d5e9dc" font-size="12">PUBLIC REPOSITORY</text><text x="416" y="88" class="small" text-anchor="end">REACHED</text><text x="54" y="110" class="small" >At least one owned public repository</text><circle cx="33" cy="157" r="8" fill="#7ee2b8"/><text x="54" y="160" class="mono" fill="#d5e9dc" font-size="12">FIRST STAR</text><text x="416" y="160" class="small" text-anchor="end">REACHED</text><text x="54" y="182" class="small" >At least one star across those repositories</text><circle cx="33" cy="229" r="8" fill="#7ee2b8"/><text x="54" y="232" class="mono" fill="#d5e9dc" font-size="12">PUBLIC COMMIT</text><text x="416" y="232" class="small" text-anchor="end">REACHED</text><text x="54" y="254" class="small" >At least one authored default-branch</text><text x="54" y="269" class="small" >commit in the last 365 days</text><text x="24" y="308" class="small" >Project milestones, not awards · 2026-10-08 UTC</text></svg>
